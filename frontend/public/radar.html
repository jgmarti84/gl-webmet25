<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Radar - WebMet25</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Shared CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="logo-container">
        <img src="/assets/images/logos/OHMC@3x.png" alt="OHMC Radar Meteorology System">
    </div>

    <!-- Map Container -->
    <div id="map">
        <div id="field-loading-badge" style="display:none;">Cargando campo…</div>
    </div>

    <!-- ===== ICON BAR (top-right) ===== -->
    <div id="icon-bar">
        <!-- Module B – Field/Layer Selection -->
        <button id="btn-module-b" class="icon-btn" title="Field Selection" aria-label="Field Selection">
            <span class="icon-glyph">⊞</span>
            <span class="icon-badge" id="badge-module-b">—</span>
        </button>

        <!-- Module C – Time Window -->
        <button id="btn-module-c" class="icon-btn" title="Time Window" aria-label="Time Window">
            <span class="icon-glyph">🕐</span>
            <span class="icon-badge" id="badge-module-c">1.5h</span>
        </button>

        <!-- Gear – Settings -->
        <button id="btn-settings" class="icon-btn" title="Configuración" aria-label="Abrir configuración">
            <span class="icon-glyph">⚙</span>
        </button>

        <!-- Snapshot -->
        <button id="btn-snapshot" class="icon-btn" title="Capturar imagen del mapa" aria-label="Capturar imagen del mapa">
            <span class="icon-glyph">📷</span>
        </button>
    </div>

    <!-- ===== RADAR HEADER (top-center) ===== -->
    <div id="radar-header">
        <button id="btn-back" class="radar-back-btn" title="Volver a la vista principal" aria-label="Volver a la vista principal">← Volver</button>
        <span id="radar-header-code">—</span>
        <span id="radar-header-title">—</span>
    </div>

    <!-- ===== MODULE B – Field/Layer Selection ===== -->
    <div id="panel-module-b" class="floating-panel" style="display:none;">
        <div class="panel-header">
            <span>⊞ Selección de Campo</span>
            <button class="panel-close" data-close="panel-module-b" aria-label="Cerrar panel">✕</button>
        </div>
        <div class="panel-body">
            <div id="layer-list">
                <!-- Populated dynamically -->
            </div>
            <!-- Collapsible field picker (replaces modal add button) -->
            <div class="field-section" id="section-add-field">
                <button type="button" class="field-section-header" aria-expanded="false" aria-controls="section-add-field-body">
                    <span class="field-section-title">Añadir campo</span>
                    <span class="field-section-chevron" aria-hidden="true"></span>
                </button>
                <div class="field-section-body" id="section-add-field-body">
                    <div class="control-group toggle-row">
                        <label class="toggle-switch-wrapper" for="toggle-field-picker-filtered">
                            <span class="toggle-switch">
                                <input type="checkbox" id="toggle-field-picker-filtered">
                                <span class="toggle-slider"></span>
                            </span>
                            <span class="toggle-label">Filtrado</span>
                        </label>
                    </div>
                    <div class="checkbox-container">
                        <div id="field-picker-list">
                            <!-- Populated dynamically -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== FIELD PICKER MODAL (used for swap only) ===== -->
    <div id="field-picker-modal" class="modal-backdrop" style="display:none;">
        <div class="modal-box">
            <div class="modal-header">
                <span>Cambiar Campo</span>
                <button id="btn-close-field-picker" class="panel-close" aria-label="Cerrar">✕</button>
            </div>
            <div id="field-picker-grid" class="field-picker-grid">
                <!-- Populated dynamically -->
            </div>
        </div>
    </div>

    <!-- ===== MODULE C – Time Selection ===== -->
    <div id="panel-module-c" class="floating-panel" style="display:none;">
        <div class="panel-header">
            <span>🕐 Ventana de Tiempo</span>
            <button class="panel-close" data-close="panel-module-c" aria-label="Close panel">✕</button>
        </div>
        <div class="panel-body">
            <div class="time-window-buttons">
                <button class="time-window-btn active" data-hours="1.5">Últimas 1.5 hrs</button>
                <button class="time-window-btn" data-hours="3">Últimas 3 hrs</button>
                <button class="time-window-btn" data-hours="4.5">Últimas 4.5 hrs</button>
                <button class="time-window-btn" data-hours="6">Últimas 6 hrs</button>
            </div>
            <div class="custom-range-toggle">
                <button id="btn-custom-range" class="link-btn">Rango personalizado…</button>
            </div>
            <div id="timerange-container" class="timerange-container" style="display:none;">
                <div class="timerange-inputs">
                    <div class="input-group dt-group">
                        <label for="start-date-date" class="input-label">Desde:</label>
                        <input type="date" id="start-date-date" class="dt-date">
                        <div id="start-time-wheel" class="dt-wheel"></div>
                        <input type="datetime-local" id="start-date" class="dt-hidden" tabindex="-1" aria-hidden="true">
                    </div>
                    <div class="input-group dt-group">
                        <label for="end-date-date" class="input-label">Hasta:</label>
                        <input type="date" id="end-date-date" class="dt-date">
                        <div id="end-time-wheel" class="dt-wheel"></div>
                        <input type="datetime-local" id="end-date" class="dt-hidden" tabindex="-1" aria-hidden="true">
                    </div>
                    <button id="btn-load-timerange" class="action-btn secondary" disabled>Cargar rango</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== SETTINGS PANEL ===== -->
    <div id="settings-panel" class="floating-panel" style="display:none;">
        <div class="panel-header">
            <span>⚙ Configuración</span>
            <button class="panel-close" data-close="settings-panel" aria-label="Cerrar configuración">✕</button>
        </div>
        <div class="panel-body">
            <!-- Basemap -->
            <div class="control-group">
                <label for="basemap-select">Basemap:</label>
                <select id="basemap-select">
                    <option value="argenmap">IGN Argenmap</option>
                    <option value="argenmap_gris">IGN Argenmap Gris</option>
                    <option value="argenmap_topo">IGN Argenmap Topo</option>
                    <option value="argenmap_oscuro">IGN Argenmap Oscuro</option>
                    <option value="argenmap_hibrido">IGN Argenmap Híbrido</option>
                </select>
            </div>
            <!-- Coverage mask controls -->
            <div class="coverage-controls">
                <div class="control-group">
                    <label for="coverage-opacity">Coverage opacity:</label>
                    <div class="opacity-control">
                        <input type="range" id="coverage-opacity" min="0" max="1" step="0.01" value="0.4">
                    </div>
                </div>
            </div>
            <!-- Keyboard shortcuts -->
            <div class="shortcuts-info">
                <details>
                    <summary>⌨️ Shortcuts</summary>
                    <div class="shortcuts-list">
                        <div><kbd>Space</kbd> Play/Pause</div>
                        <div><kbd>←</kbd> <kbd>→</kbd> Navigate</div>
                        <div><kbd>Home</kbd> Latest</div>
                    </div>
                </details>
            </div>
        </div>
    </div>

    <!-- ===== LEGEND (Bottom Left) ===== -->
    <!-- <div id="legend-container"></div> -->

    <!-- ===== ANIMATION CONTROLS (Bottom Center) ===== -->
    <div id="animation-controls">
        <div class="animation-info-row">
            <span id="time-window-label" class="time-window-label">—</span>
            <span id="live-indicator" class="live-indicator live-off" title="Live mode status">○ Live</span>
            <span id="time-display" class="frame-time-display">—</span>
            <button id="btn-collapse-controls" class="collapse-controls-btn" title="Minimizar controles" aria-label="Minimizar controles">⌃</button>
        </div>
        <div class="animation-slider-container">
            <input type="range" id="animation-slider" min="0" max="0" value="0" step="1">
        </div>
        <div class="animation-buttons">
            <button id="btn-first"  title="First frame"      aria-label="First frame">⏮</button>
            <button id="btn-prev"   title="Previous frame"   aria-label="Previous frame">◀</button>
            <button id="btn-play-pause" title="Reproducir" aria-label="Reproducir/Pausar">
                <svg class="play-pause-icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
                    <path class="icon-play" d="M8 5v14l11-7z"></path>
                    <g class="icon-pause">
                        <rect x="6" y="5" width="4" height="14" rx="1"></rect>
                        <rect x="14" y="5" width="4" height="14" rx="1"></rect>
                    </g>
                </svg>
            </button>
            <button id="btn-next"   title="Next frame"       aria-label="Next frame">▶</button>
            <button id="btn-latest" title="Go to latest frame" aria-label="Go to latest frame">⏭</button>
            <button id="btn-cog-refresh-now" title="Fetch latest COGs now" aria-label="Fetch latest COGs now" disabled>↻</button>
            <div class="speed-control" title="Animation speed">
                <span class="speed-label">Speed</span>
                <input type="range" id="speed-slider" min="0.5" max="2" step="0.1" value="1">
                <span id="speed-value">1.0x</span>
            </div>
            <span id="frame-counter">— / —</span>
        </div>
        <div id="message-area" class="message-area" role="status" aria-live="polite">
            <span id="message-text"></span>
        </div>
    </div>

    <!-- Radar no disponible -->
    <div id="radar-unavailable" class="modal-backdrop" style="display:none;">
        <div class="modal-box" style="width:340px;padding:32px 28px;text-align:center;">
            <div style="font-size:2rem;margin-bottom:12px;">⚠️</div>
            <p style="font-size:1rem;font-weight:600;margin:0 0 8px;">Vista de detalle no disponible</p>
            <p style="font-size:0.85rem;color:#aaa;margin:0 0 20px;">
                Este radar no tiene habilitada la vista de detalle.
            </p>
            <p style="font-size:0.85rem;color:#4fc3f7;">
                Volviendo al inicio en <strong id="redirect-countdown">5</strong> s…
            </p>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- One-radar page entry point -->
    <script type="module" src="js/v2/radar-app.js"></script>
</body>
</html>

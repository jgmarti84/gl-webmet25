<!DOCTYPE html>
<html lang="es-AR">
<head>
    <meta charset="UTF-8">
    <!-- Base path rule: right after the charset; nginx rewrites it to <base href="/nacho/"> behind a prefix. -->
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebMet25 · Mi perfil</title>
    <link rel="icon" type="image/png" href="assets/images/logos/OHMC@3x.png">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <!-- User profile (spec D) for viewers. nginx serves it to any logged-in user, but admins and company admins have
         the profile INSIDE their panels, so perfil.js sends them there. Same look as the admin panel (css/admin.css).
         The profile itself is drawn by js/shared/profile-section.js into #perfil-content. -->
    <div class="admin-layout">
        <aside class="sidebar">
            <div class="sidebar-logo-wrap">
                <img class="sidebar-logo" src="assets/images/logos/OHMC@3x.png" alt="OHMC Radar Meteorology System">
            </div>
            <div class="sidebar-brand">
                <span class="sidebar-brand-mark">◑</span>
                <span class="sidebar-brand-text">WebMet25<small>Perfil</small></span>
            </div>
            <nav id="sidebar-nav">
                <div class="nav-group-label">Cuenta</div>
                <a href="perfil" class="active"><span class="nav-ico">🙍</span> Mi perfil</a>
            </nav>
            <div class="sidebar-footer">
                <a id="perfil-back-sidebar" class="btn btn-ghost btn-block" href="./">← Volver al mapa</a>
            </div>
        </aside>

        <main class="main-content">
            <header class="page-header">
                <div class="page-header-left">
                    <a id="perfil-back" class="btn btn-ghost btn-back" href="./" title="Volver al mapa">←</a>
                    <h1 id="perfil-title">Mi perfil</h1>
                </div>
                <div class="session-box">
                    <span id="session-user" class="session-user"></span>
                    <button id="logout-btn" class="btn btn-secondary btn-sm" type="button">Cerrar sesión</button>
                </div>
            </header>

            <!-- Same notice as the admin panel: a close button, and success notices close by themselves. -->
            <div id="perfil-message" class="feedback-message hidden" role="status">
                <span class="feedback-text"></span>
                <button type="button" class="feedback-close" aria-label="Cerrar aviso">×</button>
            </div>

            <div id="perfil-content"></div>
        </main>
    </div>

    <!-- Same modal markup as admin.html (classes that exist in css/admin.css). -->
    <div id="form-modal" class="modal hidden" role="dialog" aria-modal="true">
        <div class="modal-card">
            <div class="modal-header">
                <h2 id="form-modal-title">Editar</h2>
                <button id="close-form-modal" class="btn btn-secondary btn-sm" type="button">Cerrar</button>
            </div>
            <form id="form-modal-body" class="form-grid"></form>
        </div>
    </div>

    <script type="module" src="js/shared/tooltip.js"></script>
    <script type="module" src="js/perfil.js"></script>
</body>
</html>

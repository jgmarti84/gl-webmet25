# frontend/nginx.conf
# Unified nginx config for both v1 and v2 frontend.
# Always listens on port 80.
# proxy_buffering off on /api/ is required for SSE (Phase 2, Task 2.2).

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    gzip on;
    gzip_types text/plain text/css application/json
               application/javascript text/xml application/xml;

    # Cache for proxied OSM tiles
    proxy_cache_path /var/cache/nginx/osm_tiles
        levels=1:2
        keys_zone=osm_tiles:10m
        max_size=1g
        inactive=30d
        use_temp_path=off;

    server {
        listen 80;
        server_name localhost;

        # Static files
        location / {
            root  /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # TODO: Replace temporary Basic Auth with proper JWT authentication before production deployment.
        location = /admin {
            auth_basic "WebMet25 Admin";
            auth_basic_user_file /etc/nginx/admin.htpasswd;
            root /usr/share/nginx/html;
            try_files /admin.html =404;
        }

        # Admin SPA static assets and hash-routed paths
        location ^~ /admin/ {
            auth_basic "WebMet25 Admin";
            auth_basic_user_file /etc/nginx/admin.htpasswd;
            root /usr/share/nginx/html;
            try_files $uri $uri/ /admin.html;
        }

        # Admin API is protected with the same temporary Basic Auth layer
        location ^~ /api/v1/admin/ {
            auth_basic "WebMet25 Admin";
            auth_basic_user_file /etc/nginx/admin.htpasswd;
            proxy_pass         http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_buffering    off;
        }

        # API proxy
        # proxy_buffering off: required for SSE (Phase 2, Task 2.2)
        location /api/ {
            proxy_pass         http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_buffering    off;
        }

        # OSM tile proxy — adds required headers, caches locally
        location /osm-tiles/ {
            proxy_pass         https://tile.openstreetmap.org/;
            proxy_http_version 1.1;
            proxy_ssl_server_name on;
            proxy_set_header   Host       "tile.openstreetmap.org";
            proxy_set_header   Referer    "https://www.openstreetmap.org/";
            proxy_set_header   User-Agent "WebMet25 radar visualization";
            proxy_set_header   X-Real-IP         "";
            proxy_set_header   X-Forwarded-For   "";
            proxy_cache        osm_tiles;
            proxy_cache_key    "$uri";
            proxy_cache_valid  200 30d;
            proxy_cache_use_stale error timeout updating http_500 http_503;
            add_header         X-Cache-Status $upstream_cache_status;
        }

        # IGN (Instituto Geográfico Nacional, Argentina) tile proxy.
        # Required because wms.ign.gob.ar does not send CORS headers.
        # Reuses the same cache zone as OSM tiles to avoid extra config.
        location /ign-tiles/ {
            proxy_pass         https://wms.ign.gob.ar/geoserver/gwc/service/tms/1.0.0/;
            proxy_http_version 1.1;
            proxy_ssl_server_name on;
            proxy_set_header   Host       "wms.ign.gob.ar";
            proxy_set_header   Referer    "https://www.ign.gob.ar/";
            proxy_set_header   User-Agent "WebMet25 radar visualization";
            proxy_set_header   X-Real-IP         "";
            proxy_set_header   X-Forwarded-For   "";
            proxy_cache        osm_tiles;
            proxy_cache_key    "$uri";
            proxy_cache_valid  200 7d;
            proxy_cache_use_stale error timeout updating http_500 http_503;
            add_header         X-Cache-Status $upstream_cache_status;
        }

        # Health check
        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }
    }
}

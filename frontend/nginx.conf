# frontend/nginx.conf
# Unified nginx config for both v1 and v2 frontend.
# Always listens on port 80.
# proxy_buffering off on /api/ is required for SSE (Phase 2, Task 2.2).
#
# What nginx does here, in short. Every browser request comes in through this file and one
# of three things happens:
#   1. nginx serves a static file from disk (HTML, JS, CSS, images).
#   2. nginx forwards the request to another service ("proxy"): the API or a map tile server.
#   3. nginx answers by itself (a redirect, an error page, "OK").
#
# nginx never checks passwords or roles. For protected pages it asks the API
# ("auth_request") and turns the API's answer into a page.
#
# Syntax reminders:
#   - Every directive ends with ";". Blocks are grouped with { }.
#   - $name is a variable that nginx fills in for each request ($uri = requested path,
#     $host, $remote_addr = client IP, $args = query string).
#   - A "location" block decides what to do for a group of paths (see the symbols below).

# Required top-level block: how many simultaneous connections each worker process accepts.
events {
    worker_connections 1024;
}

# Everything about HTTP lives inside this block.
http {
    # Maps file extensions to content types (".css" -> text/css, ".js" -> application/javascript).
    include       /etc/nginx/mime.types;
    # Used when the extension is unknown: the browser treats the file as a binary download.
    default_type  application/octet-stream;

    # Where nginx writes one line per request, and where it writes its own errors.
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # Compress these response types so pages download faster.
    gzip on;
    gzip_types text/plain text/css application/json
               application/javascript text/xml application/xml;

    # Cache for proxied OSM tiles.
    # This only DECLARES the cache. Nothing is cached until a location uses it with
    # "proxy_cache osm_tiles" (see /osm-tiles/ and /ign-tiles/ below).
    proxy_cache_path /var/cache/nginx/osm_tiles
        levels=1:2              # split files into subfolders so one folder never holds millions of files
        keys_zone=osm_tiles:10m # cache name + 10 MB of memory for its index
        max_size=1g             # at most 1 GB on disk
        inactive=30d            # drop tiles nobody asked for in 30 days
        use_temp_path=off;      # write straight to the final place, without a temp copy

    # Base path (spec base-path). A proxy in front may serve this site under a prefix: it strips the prefix
    # ("/nacho/api/v1/radars" arrives here as "/api/v1/radars") and sends "X-Forwarded-Prefix: /nacho".
    # Only one simple segment is accepted ("/" + letters, digits, "_" or "-"); anything else, or no header, means
    # "served at the root". The value is written into every HTML page below, so it must never carry markup.
    map $http_x_forwarded_prefix $base_path {
        default                "";
        "~^/[A-Za-z0-9_-]+$"   $http_x_forwarded_prefix;
    }

    # Login brute-force limit per client IP (see spec, section 9).
    # If a proxy (Caddy) sits in front, configure set_real_ip_from + real_ip_header.
    # This only DECLARES the counter: one counter per client IP ($binary_remote_addr),
    # 10 MB of memory to keep them, and a pace of 10 requests per minute.
    # It is applied by "limit_req" in the /api/v1/auth/(login|google) location below.
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;

    # Same idea for the public sign-up endpoints that write or send mail (register, verify, resend, forgot,
    # reset): their own counter, so using the login does not eat the sign-up quota and the other way round.
    # It is applied by the regex location "^/api/v1/auth/(register|...)$" below.
    # The limit is per client IP: behind a proxy it needs set_real_ip_from (see the note above), or every
    # visitor would share the proxy's IP and use up the quota for everybody.
    limit_req_zone $binary_remote_addr zone=auth_mail_limit:10m rate=10r/m;

    # One "server" is one virtual site. This file has a single one.
    server {
        listen 80;
        server_name localhost;

        # Base folder for static files: a request for /js/app.js reads
        # /usr/share/nginx/html/js/app.js.
        root /usr/share/nginx/html;

        # Redirects use a relative Location ("/"): the port and scheme the browser sees (dev port, HTTPS
        # behind a proxy) are not the ones nginx listens on.
        absolute_redirect off;

        # Every HTML page carries <base href="/"> right after <meta charset>. Behind a prefix it becomes
        # <base href="/nacho/">, and every relative URL of the page (links, scripts, fetch, redirects) resolves
        # inside the prefix. At the root the text stays the same. Applies to every text/html response, including
        # the login served in place (@login) and @unavailable.
        sub_filter       '<base href="/">' '<base href="$base_path/">';
        sub_filter_once  on;

        # ------------------------------------------------------------------
        # How the "location" blocks below are matched:
        #   location = /x     exact path only
        #   location /x/      any path starting with /x/ (prefix; the longest prefix wins)
        #   location ^~ /x/   prefix that wins over regex locations if it matches
        #   location ~ regex  regular expression (case sensitive)
        #   location @name    internal destination: no URL matches it, other directives jump to it
        # Order of decision: an exact match wins; otherwise the longest prefix is remembered
        # (and used right away if it has ^~); otherwise regex locations are tried top to bottom;
        # if none match, the remembered prefix is used.
        # ------------------------------------------------------------------

        # ------------------------------------------------------------------
        # Session probes: nginx asks the API before serving a protected page.
        # The browser cookies travel with the subrequest; $args is fixed so the
        # page's own query string never reaches the API.
        #
        # The API answers 204 (ok), 401 (no session) or 403 (wrong role).
        # "auth_request" in the protected locations below turns those answers into pages.
        # ------------------------------------------------------------------

        # Probe 1: "is there a valid session?" (any role). Used by the map pages.
        location = /_auth {
            # Only nginx itself can call this location; a browser asking for /_auth gets a 404.
            internal;
            # Empty query string: nobody can slip "?role=..." from the page URL into the probe.
            set                     $args "";
            # Asks the API's session probe. "api" is the Docker service name of the API container.
            proxy_pass              http://api:8000/api/v1/auth/check;
            # The probe only needs the cookies (they are forwarded by default), not the body.
            proxy_pass_request_body off;
            proxy_set_header        Content-Length "";
            # The API needs the base path for the cookie names and paths. Send the validated value (or ""),
            # never the raw header from the client.
            proxy_set_header        X-Forwarded-Prefix $base_path;
        }

        # Probe 2: "is there a valid session AND is the user an admin?". Used by the admin panel.
        # The page decides what it requires; the user's real role is read by the API from its own
        # database through the cookie, never from the browser.
        location = /_auth_admin {
            internal;
            # Always asks for the admin role, whatever the browser put in the URL.
            set                     $args "role=admin";
            proxy_pass              http://api:8000/api/v1/auth/check;
            proxy_pass_request_body off;
            proxy_set_header        Content-Length "";
            # Validated base path for the API (see /_auth).
            proxy_set_header        X-Forwarded-Prefix $base_path;
        }

        # Probe 3: "is the access token valid?", without reading the user from the database.
        # Used ONLY by the basemap tile proxies below. Moving the map asks for dozens of tiles at once
        # and each one runs this probe; probe 1 would spend a database connection on every tile.
        # Trade-off: a user deactivated a moment ago keeps getting basemap tiles (public OSM/IGN images)
        # until the access token expires (30 min at most). The map pages and the radar data still use
        # probe 1 or the API's own full check, so that user loses everything else at once.
        location = /_auth_token {
            internal;
            set                     $args "";
            proxy_pass              http://api:8000/api/v1/auth/check-token;
            proxy_pass_request_body off;
            proxy_set_header        Content-Length "";
            # Validated base path for the API (see /_auth).
            proxy_set_header        X-Forwarded-Prefix $base_path;
        }

        # No session: the login page is served in place (same URL, status 401).
        location @login {
            # "no-store": the browser must not keep this page. "always" adds it even on error statuses.
            add_header Cache-Control "no-store" always;
            # Serve login.html; if the file is missing, answer 404.
            try_files /login.html =404;
        }

        # Logged in but not an admin: back to the map (inside the base path, if any).
        location @to_map {
            # 302 = temporary redirect to the map.
            return 302 $base_path/;
        }

        # The API could not answer the probe.
        location @unavailable {
            add_header Cache-Control "no-store" always;
            try_files /unavailable.html =503;
        }

        # ------------------------------------------------------------------
        # Protected pages (any logged-in user)
        #
        # Pattern used by every protected location:
        #   auth_request /_auth;   ask the API first
        #   error_page 401 @login; probe said "no session"  -> show the login page
        #   error_page 500 502 503 504 =503 @unavailable;
        #                          probe failed or the API is down -> show "unavailable";
        #                          the "=503" forces that final status code
        #   try_files ...          probe said OK -> serve the page
        # ------------------------------------------------------------------

        # The map, at "/".
        location = / {
            auth_request /_auth;
            error_page 401 @login;
            error_page 500 502 503 504 =503 @unavailable;
            try_files /index.html =404;
        }

        # Regex: starts with "/", then "index", "radar" or "cog-browser" ("|" means "or"),
        # then a literal ".html" ("\." is a real dot), and ends there ("$").
        # $uri is the requested path, so try_files serves that same file.
        location ~ ^/(index|radar|cog-browser)\.html$ {
            auth_request /_auth;
            error_page 401 @login;
            error_page 500 502 503 504 =503 @unavailable;
            try_files $uri =404;
        }

        # Static files (code, styles, images) are public: they carry no data. Any other path falls
        # back to the map, which is protected.
        # try_files tries its options in order: first a file named like the path ($uri),
        # and only if it does not exist it jumps to the @map location.
        location / {
            try_files $uri @map;
        }

        # Fallback for unknown paths: serves the map, but only to logged-in users.
        # (This is the usual single-page-app pattern.)
        location @map {
            auth_request /_auth;
            error_page 401 @login;
            error_page 500 502 503 504 =503 @unavailable;
            try_files /index.html =404;
        }

        # ------------------------------------------------------------------
        # Admin panel (admin role). A viewer is sent back to the map.
        #
        # Same pattern as above, with two differences:
        #   - it uses /_auth_admin, so the probe also requires the admin role;
        #   - "error_page 403 = @to_map": a 403 (logged in, wrong role) jumps to @to_map, and the
        #     "=" with no number means "use the status code of that destination" (a 302 redirect).
        #
        # Three locations cover the three ways of reaching the panel.
        # ------------------------------------------------------------------
        location = /admin {
            auth_request /_auth_admin;
            error_page 401 @login;
            error_page 403 = @to_map;
            error_page 500 502 503 504 =503 @unavailable;
            try_files /admin.html =404;
        }

        location = /admin.html {
            auth_request /_auth_admin;
            error_page 401 @login;
            error_page 403 = @to_map;
            error_page 500 502 503 504 =503 @unavailable;
            try_files /admin.html =404;
        }

        # Everything under /admin/. "^~" makes this prefix win over any regex location.
        # try_files: the file as asked, then as a folder, then admin.html (single-page-app fallback).
        location ^~ /admin/ {
            auth_request /_auth_admin;
            error_page 401 @login;
            error_page 403 = @to_map;
            error_page 500 502 503 504 =503 @unavailable;
            try_files $uri $uri/ /admin.html;
        }

        # The login page itself must be reachable WITHOUT a session, so it has no auth_request.
        location = /login {
            root /usr/share/nginx/html;
            try_files /login.html =404;
        }

        # Public pages of sign-up and password recovery. Like /login they have no auth_request: the person
        # does not have a session yet. They are plain HTML files; the work is done by the API calls they make.
        location = /register {
            try_files /register.html =404;
        }

        location = /forgot {
            try_files /forgot.html =404;
        }

        # The links of the mails carry a one-time token after "#" (/verify#token=...). The browser never sends the
        # part after "#", so the token never reaches this server nor its access log. The two headers are kept as
        # defense in depth: these pages must not be cached and must not leak their address to other sites through
        # the Referer header when the person follows a link from them. "always" adds them on error answers too.
        location = /verify {
            add_header Cache-Control "no-store" always;
            add_header Referrer-Policy "no-referrer" always;
            try_files /verify.html =404;
        }

        location = /reset {
            add_header Cache-Control "no-store" always;
            add_header Referrer-Policy "no-referrer" always;
            try_files /reset.html =404;
        }

        # Public endpoints that write or send mail: same per-IP limit style and proxy headers as the login.
        # A regex location ("~") is checked before the plain "/api/" prefix below, so these five paths get the
        # limit and everything else under /api/ (for example GET /api/v1/auth/options) does not.
        # The "$" at the end makes it an exact match: no extra path after the endpoint name.
        location ~ ^/api/v1/auth/(register|verify-email|resend-verification|forgot-password|reset-password)$ {
            # Uses the counter declared in "http" (10 requests per minute per IP), burst=5 as in the login.
            limit_req          zone=auth_mail_limit burst=5 nodelay;
            limit_req_status   429;
            # No path after the host, so the original path is kept (see the login location).
            proxy_pass         http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            # Validated base path for the API (see /_auth).
            proxy_set_header   X-Forwarded-Prefix $base_path;
        }

        # Login and "Sign in with Google" endpoints with per-IP rate limit (the same counter: both start a session).
        # A regex location ("~") is checked before the generic "/api/" prefix location below; the "$" makes it exact.
        location ~ ^/api/v1/auth/(login|google)$ {
            # Uses the counter declared in "http" (10 requests per minute per IP).
            # burst=5: accepts up to 5 extra requests above that pace.
            # nodelay: those 5 are served at once instead of being queued; anything beyond is rejected.
            limit_req          zone=login_limit burst=5 nodelay;
            # Rejected requests get 429 "Too Many Requests" (the default would be 503).
            limit_req_status   429;
            # Forward the request to the API. No path in the URL, so the original path is kept.
            proxy_pass         http://api:8000;
            proxy_http_version 1.1;
            # The API sees nginx as its client, so these headers pass along the real client data:
            # original host, client IP, the chain of proxies, and whether it came over http or https.
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            # Validated base path for the API (see /_auth).
            proxy_set_header   X-Forwarded-Prefix $base_path;
        }

        # API proxy
        # proxy_buffering off: required for SSE (Phase 2, Task 2.2)
        # Note: there is NO auth_request here. nginx does not protect the API's data endpoints;
        # the API checks the session itself on each one.
        location /api/ {
            # "http://api:8000" with no path: /api/v1/radars reaches the API as /api/v1/radars.
            # (With a trailing slash, as in the tile proxies below, the matched prefix is replaced.)
            proxy_pass         http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            # Validated base path for the API (see /_auth).
            proxy_set_header   X-Forwarded-Prefix $base_path;
            # Pass the response on as it arrives instead of collecting it first.
            # SSE (live events) would show nothing in the browser until the buffer filled.
            proxy_buffering    off;
        }

        # OSM tile proxy — adds required headers, caches locally
        # Requires a valid access token (probe 3, no database read). The browser asks nginx for map
        # tiles; nginx fetches them from OpenStreetMap on its behalf and keeps a local copy.
        location /osm-tiles/ {
            auth_request       /_auth_token;
            # Trailing slash: the matched prefix is replaced, so
            # /osm-tiles/5/10/12.png becomes https://tile.openstreetmap.org/5/10/12.png
            proxy_pass         https://tile.openstreetmap.org/;
            proxy_http_version 1.1;
            # Send the site name in the HTTPS handshake (SNI); many HTTPS servers need it.
            proxy_ssl_server_name on;
            # Headers OSM expects from a client (it asks for an identifying User-Agent).
            proxy_set_header   Host          "tile.openstreetmap.org";
            proxy_set_header   Referer       "https://www.openstreetmap.org/";
            proxy_set_header   User-Agent    "WebMet25 radar visualization";
            # Setting a header to "" REMOVES it from the forwarded request. This stops the user's
            # session cookie and IP from being sent to a third-party server.
            proxy_set_header   Authorization "";
            proxy_set_header   Cookie        "";
            proxy_set_header   X-Real-IP         "";
            proxy_set_header   X-Forwarded-For   "";
            # Use the cache declared in "http". The key is the requested path, and only
            # 200 answers are kept, for 30 days.
            proxy_cache        osm_tiles;
            proxy_cache_key    "$uri";
            proxy_cache_valid  200 30d;
            # If OSM fails or is slow, serve the old cached copy instead of an error.
            proxy_cache_use_stale error timeout updating http_500 http_503;
            # Debug header: shows HIT (served from cache) or MISS (fetched from OSM).
            add_header         X-Cache-Status $upstream_cache_status;
        }

        # IGN (Instituto Geográfico Nacional, Argentina) tile proxy.
        # Required because wms.ign.gob.ar does not send CORS headers.
        # Reuses the same cache zone as OSM tiles to avoid extra config.
        # Same structure as the OSM block above. The cache key is the path, and the
        # /osm-tiles/ and /ign-tiles/ prefixes differ, so the two never overwrite each other.
        location /ign-tiles/ {
            auth_request       /_auth_token;
            proxy_pass         https://wms.ign.gob.ar/geoserver/gwc/service/tms/1.0.0/;
            proxy_http_version 1.1;
            proxy_ssl_server_name on;
            proxy_set_header   Host          "wms.ign.gob.ar";
            proxy_set_header   Referer       "https://www.ign.gob.ar/";
            proxy_set_header   User-Agent    "WebMet25 radar visualization";
            proxy_set_header   Authorization "";
            proxy_set_header   Cookie        "";
            proxy_set_header   X-Real-IP         "";
            proxy_set_header   X-Forwarded-For   "";
            proxy_cache        osm_tiles;
            proxy_cache_key    "$uri";
            # Kept 7 days instead of the 30 used for OSM.
            proxy_cache_valid  200 7d;
            proxy_cache_use_stale error timeout updating http_500 http_503;
            add_header         X-Cache-Status $upstream_cache_status;
        }

        # Health check
        # Answers "OK" by itself without touching the API, so Docker or a monitor can tell
        # that nginx is alive.
        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }
    }
}

services:
  # ==========================================================================
  # REDIS L2 TILE CACHE
  # ==========================================================================
  redis:
    image: redis:7.2-alpine
    container_name: radar_redis
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ==========================================================================
  # DATABASE
  # ==========================================================================
  radar_db:
    image: postgis/postgis:15-3.5
    container_name: radar_db-gl
    environment: 
      POSTGRES_DB: ${DB_NAME:-radar_prod_db}
      POSTGRES_USER: ${DB_USER:-radar}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env (see .env.example)}
    volumes:
      - ../radar_db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-radar} -d ${DB_NAME:-radar_prod_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==========================================================================
  # DATABASE INITIALIZATION (runs once)
  # ==========================================================================
  db-init:
    build:
      context: ./database
      dockerfile: Dockerfile
    container_name: radar_db_init-gl
    environment:
      DB_HOST: radar_db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-radar_prod_db}
      DB_USER: ${DB_USER:-radar}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env (see .env.example)}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    depends_on:
      radar_db:
        condition: service_healthy
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        python -m radar_db.manage init &&
        python -m radar_db.manage seed &&
        python -m radar_db.manage bootstrap-admin &&
        echo 'Database initialized!'
      "
    restart: "no"

  # ==========================================================================
  # COG INDEXER SERVICE
  # ==========================================================================
  indexer:
    build:
      context: ./
      dockerfile: ./indexer/Dockerfile
    container_name: radar_indexer
    environment:
      DB_HOST: radar_db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-radar_prod_db}
      DB_USER: ${DB_USER:-radar}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env (see .env.example)}
      WATCH_PATH: /product_output
      SCAN_INTERVAL: 30
      FILE_PATTERN: "*.tif"
      COMPUTE_STATS: "true"
      COMPUTE_CHECKSUM: "false"
      RADAR_CODES: "RMA1, RMA2, RMA3, RMA4, RMA5, RMA6, RMA7, RMA8, RMA9, RMA10, RMA11, RMA12, RMA13, RMA14, RMA15, RMA16, RMA17, RMA18, RMA20, AR5, AR7, AR8"   # Optional: limit to specific radars
      TOPS_AND_CORES_DIR: /tops_and_cores
    volumes:
      - ../product_output:/product_output
      - ../tops_and_cores:/tops_and_cores
      - ../logs:/logs
    depends_on:
      radar_db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ==========================================================================
  # BACKEND API
  # ==========================================================================
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    # Override CMD from Dockerfile to enable multi-worker mode without rebuilding.
    # UVICORN_WORKERS defaults to 4 if not set in the environment.
    # Set UVICORN_WORKERS=1 in .env to revert to a single worker for debugging.
    # Requires Redis to be running for a shared L2 tile cache across workers.
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --workers ${UVICORN_WORKERS:-4}
      --loop uvloop
      --http httptools
      --proxy-headers
      --forwarded-allow-ips '*'
    container_name: radar_api
    environment:
      DB_HOST: radar_db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-radar_prod_db}
      DB_USER: ${DB_USER:-radar}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env (see .env.example)}
      COG_BASE_PATH: /product_output
      TOPS_AND_CORES_DIR: /tops_and_cores
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (see .env.example)}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # Session and lockout settings: same defaults as api/app/config.py (change them in .env)
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-30}
      SESSION_IDLE_TTL_HOURS: ${SESSION_IDLE_TTL_HOURS:-48}
      SESSION_ABSOLUTE_TTL_DAYS: ${SESSION_ABSOLUTE_TTL_DAYS:-7}
      LOGIN_MAX_FAILED_ATTEMPTS: ${LOGIN_MAX_FAILED_ATTEMPTS:-5}
      LOGIN_LOCKOUT_MINUTES: ${LOGIN_LOCKOUT_MINUTES:-15}
    volumes:
      - ../product_output:/product_output:ro
      - ../tops_and_cores:/tops_and_cores:ro
    # Only reachable from the host itself (local dev, SSH); public traffic goes through nginx.
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      radar_db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ==========================================================================
  # FRONTEND
  # ==========================================================================
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        FE_VERSION: ${FE_VERSION:-v2}
    container_name: radar_frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  redis_data: